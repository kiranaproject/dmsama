# Samarinda Display Manager (dmsama) Configuration
# ================================================

[Daemon]
# X11 display specification
display=:0

# Virtual terminal allocation (default: vt7)
vt=7

# Pre-session greeter command to execute
greeter=shellsama --greeter

# Dedicated unprivileged user under which the greeter process executes
greeter_user=dmsama

# Fallback session name from /usr/share/xsessions
default_session=mate

# Directory containing X11 desktop session descriptors
sessions_dir=/usr/share/xsessions

# Enable automatic login without greeter
auto_login=false

# Target user account for automatic login
auto_login_user=

[XServer]
# Xorg server binary path
command=/usr/lib/xorg/Xorg

# Arguments passed to Xorg binary
args=-core -noreset

# Directory for runtime Xauthority and lock files
auth_dir=/var/run/dmsama
